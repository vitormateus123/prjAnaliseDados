# fly.toml app configuration file generated for backend-vivid-waterfall-9789
app = 'backend-vivid-waterfall-9789'
primary_region = 'gru'

[build]
  # O Dockerfile vive na raiz do repo; o build context tambem.
  dockerfile = '../Dockerfile'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[processes]
  app = "uvicorn app.main:app --host 0.0.0.0 --port 8000"
  # O grupo "worker" NAO e declarado aqui de proposito: `fly deploy` tentaria
  # criar uma maquina worker sempreligada (e o deploy time out).
  # A maquina do worker e criada manualmente com schedule (ver bloco abaixo).

# ---------------------------------------------------------------------------
# Maquina do worker agendada.
#
# IMPORTANTE: Fly.io Machine schedules NAO aceitam cron expressions.
# Valores aceitos: hourly | daily | weekly | monthly.  Minimo = 1 hora.
# Entao a maquina acorda de hora em hora e o worker_runner faz o loop
# interno de 12 execucoes com 5 min de intervalo (WORKER_RUNS / WORKER_INTERVAL_SECONDS).
#
# Comando (rode da raiz do repo C:\prjAnaliseDados):
#   fly machine run -a backend-vivid-waterfall-9789 `
#     registry.fly.io/backend-vivid-waterfall-9789:<tag> `
#     --schedule hourly --region gru --vm-size shared-cpu-1x --vm-memory 512 `
#     --restart no python -m app.services.worker_runner
#
# (em `machine run` o comando e POSICIONAL; o flag --command so vale no `machine update`)
# ---------------------------------------------------------------------------

[env]
  PORT = "8000"
  RUN_WORKER = "false"